<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Successful — TaxSnap.site</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui;background:#F6F3EF;min-height:100vh;display:grid;place-items:center;color:#0F3D2E}
.card{background:#fff;padding:36px 28px;border-radius:28px;box-shadow:0 20px 60px rgba(15,61,46,.12);max-width:360px;width:92%;text-align:center}
.badge{display:inline-flex;background:#E6F4EA;color:#137333;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;margin-bottom:14px}
h1{font-size:26px;letter-spacing:-.02em;margin-bottom:8px}
p{font-size:14px;color:#6b7d76;margin-bottom:20px;line-height:1.5}
.btn{display:block;width:100%;background:#0F3D2E;color:#fff;text-decoration:none;padding:14px;border-radius:14px;font-weight:700;margin-bottom:10px}
.small{font-size:11px;color:#8aa097}
</style>
</head>
<body>
<div class="card">
<div class="badge">✓ PAYMENT VERIFIED • WINDOWS VALID</div>
<h1>Payment Successful</h1>
<p>Your TaxSnap Pro is active.<br/>Redirecting to app in <span id="count">3</span>s…</p>
<a class="btn" href="index.html?success=true">Open App → index.html?success=true</a>
<div class="small">Auto-redirect via JS • Stripe → ?success=true</div>
</div>
<script>
let c=3; const el=document.getElementById('count');
const iv=setInterval(()=>{ c--; if(el) el.textContent=c; if(c<=0){ clearInterval(iv); location.href='index.html?success=true'; } },1000);
</script>
</body>
</html>
